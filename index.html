        html, body {
            overflow-x: hidden;
            max-width: 100%;

    <style type="text/tailwindcss">
        @layer components {
            .btn {
                @apply bg-accent text-[#ffffff] px-3 py-2 rounded-xl hover:bg-accent-hover transition;

                @apply w-full h-10 px-3 py-2 rounded-xl

                focus:outline-none focus:border-2 focus:border-accent;
            }
            .modal{
                @apply

            }
            .card{

            }
        }
    </style>
